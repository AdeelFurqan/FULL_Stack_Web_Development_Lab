<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook</title>

  <!-- Bootstrap CSS from CDN -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

  <!-- Top Navbar -->
  <nav class="navbar navbar-dark bg-primary px-4 py-2">
    <span class="navbar-brand fs-2 fw-bold">facebook</span>

    <form class="d-flex mx-auto" style="width: 250px;">
      <input class="form-control rounded-pill" type="text" placeholder="Search Facebook">
    </form>

    <div>
      <a href="#" class="text-white fw-bold text-decoration-none me-3">Home</a>
      <a href="#" class="text-white fw-bold text-decoration-none">About</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="row justify-content-center align-items-center mt-5 gy-4">

      <!-- Left intro text -->
      <div class="col-md-5">
        <h1 class="text-primary">Facebook helps you connect and share with the people in your life.</h1>
      </div>

      <!-- Right login box -->
      <div class="col-md-4">
        <div class="card p-3 shadow">
          <div class="card-body text-center">
            <input type="text" class="form-control mb-3" placeholder="Email or phone number">
            <input type="password" class="form-control mb-3" placeholder="Password">
            <button class="btn btn-primary w-100 fw-bold fs-5">Log In</button>
            <a href="#" class="d-block mt-3 text-primary text-decoration-none">Forgotten password?</a>
            <hr>
            <button class="btn btn-success">Create New Account</button>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>

</html>
