<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Messi Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Messi Store</a>
            <a class="btn btn-outline-light" href="#products">Shop</a>
        </div>
    </nav>

    <header class="bg-light text-center py-5">
        <div class="container">
            <h1>Welcome to Messi Store</h1>
            <p class="lead">Simple shopping for everyday tech.</p>
            <a class="btn btn-primary" href="#products">Browse Products</a>
        </div>
    </header>

    <main class="container my-5" id="products">
        <h2 class="text-center mb-4">Our Products</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" class="card-img-top" alt="Headphones">
                    <div class="card-body">
                        <h3 class="h5 card-title">Wireless Headphones</h3>
                        <p class="card-text">$59.99</p>
                        <a href="#" class="btn btn-primary">Buy Now</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" class="card-img-top" alt="Smart watch">
                    <div class="card-body">
                        <h3 class="h5 card-title">Smart Watch</h3>
                        <p class="card-text">$89.99</p>
                        <a href="#" class="btn btn-primary">Buy Now</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500&q=80" class="card-img-top" alt="Laptop">
                    <div class="card-body">
                        <h3 class="h5 card-title">Laptop</h3>
                        <p class="card-text">$899.99</p>
                        <a href="#" class="btn btn-primary">Buy Now</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Messi Store</p>
    </footer>
</body>
</html>
